<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 LuckySpin5Reel - Premium Casino</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 80%, rgba(255, 0, 150, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(0, 200, 255, 0.1) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(135deg, #1a0033 0%, #0a0015 50%, #1a0033 100%);
            border-radius: 30px;
            box-shadow: 0 0 60px rgba(255, 0, 200, 0.3),
                        0 0 100px rgba(0, 200, 255, 0.2),
                        inset 0 0 40px rgba(255, 200, 0, 0.1);
            overflow: hidden;
            border: 2px solid;
            border-image: linear-gradient(135deg, #ff00ff, #00ffff, #ffff00, #ff00ff) 1;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 200, 0, 0.1) 50%, transparent 70%);
            animation: shine 3s infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .header {
            background: linear-gradient(135deg, #ff00ff 0%, #00ffff 50%, #ffff00 100%);
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 30px rgba(255, 0, 255, 0.5);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #000;
            text-shadow: 2px 2px 0px #00ffff, 4px 4px 0px #ff00ff;
            letter-spacing: 3px;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .player-info {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: 15px;
            gap: 10px;
        }

        .info-item {
            text-align: center;
            background: rgba(0, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #00ffff;
            flex: 1;
        }

        .info-label {
            font-size: 11px;
            color: #00ffff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 20px;
            font-weight: 800;
            color: #ffff00;
            text-shadow: 0 0 10px #ffff00;
            margin-top: 5px;
            font-family: 'Orbitron', sans-serif;
        }

        .screen {
            display: none;
            padding: 25px;
            min-height: 500px;
            position: relative;
            z-index: 2;
        }

        .screen.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 700;
            margin-bottom: 10px;
            color: #00ffff;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group input {
            padding: 15px;
            border: 2px solid #00ffff;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(0, 255, 255, 0.05);
            color: #ffff00;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            background: rgba(255, 0, 255, 0.1);
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            font-weight: 800;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.8),
                        0 5px 20px rgba(0, 255, 255, 0.5);
        }

        .btn-secondary {
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            border: 2px solid #00ffff;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .menu-btn {
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.4), rgba(0, 255, 255, 0.4));
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6),
                        0 0 20px rgba(255, 0, 255, 0.4);
            border-color: #ff00ff;
            color: #ffff00;
        }

        .game-display {
            background: linear-gradient(135deg, rgba(255, 200, 0, 0.15), rgba(255, 0, 150, 0.15));
            border: 3px solid #ffff00;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.3),
                        inset 0 0 20px rgba(255, 255, 0, 0.1);
            position: relative;
        }

        .game-title {
            color: #ffff00;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ffff00, 0 0 40px #ff00ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .reels-wrapper {
            background: linear-gradient(135deg, #000a1a, #1a0033);
            border: 3px solid #00ffff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 30px rgba(0, 255, 255, 0.2),
                        0 0 20px rgba(0, 255, 255, 0.3);
        }

        .reels-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            perspective: 1000px;
        }

        .reel {
            width: 70px;
            height: 100px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.3), rgba(0, 255, 255, 0.3));
            border: 3px solid #ffff00;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.5),
                        inset 0 0 10px rgba(255, 200, 0, 0.2);
            position: relative;
            transition: all 0.1s ease;
        }

        .reel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 10px;
            pointer-events: none;
        }

        .reel.spin {
            animation: spinReel 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes spinReel {
            0% { transform: rotateY(0deg) rotateZ(0deg); }
            50% { transform: rotateY(720deg) rotateZ(10deg); }
            100% { transform: rotateY(1440deg) rotateZ(0deg); }
        }

        .reel.win {
            animation: reelWin 0.5s ease-out;
        }

        @keyframes reelWin {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .bet-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #00ffff;
        }

        .bet-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #ffff00;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(255, 255, 0, 0.2), rgba(255, 0, 255, 0.2));
            color: #ffff00;
            font-weight: 800;
            transition: all 0.2s ease;
            font-family: 'Orbitron', sans-serif;
        }

        .bet-btn:hover {
            background: linear-gradient(135deg, rgba(255, 255, 0, 0.4), rgba(255, 0, 255, 0.4));
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.6);
        }

        .bet-display {
            font-size: 22px;
            font-weight: 800;
            color: #ffff00;
            min-width: 100px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #ffff00;
        }

        .spin-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff0099, #ff6600);
            color: white;
            border: 3px solid #ffff00;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 30px rgba(255, 0, 150, 0.6);
            position: relative;
            overflow: hidden;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 0 50px rgba(255, 0, 150, 0.9),
                        0 5px 20px rgba(255, 100, 0, 0.6);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(0.98);
        }

        .win-display {
            background: linear-gradient(135deg, rgba(255, 255, 0, 0.2), rgba(255, 0, 150, 0.2));
            border: 3px solid #ffff00;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.4);
        }

        .win-label {
            font-size: 12px;
            color: #00ffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .win-amount {
            font-size: 32px;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 0 0 20px #ffff00, 0 0 40px #ff00ff;
            font-family: 'Orbitron', sans-serif;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            animation: fadeInModal 0.3s ease-out;
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #1a0033, #0a0015);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 400px;
            animation: popupShow 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid;
            border-image: linear-gradient(135deg, #ffff00, #ff00ff, #00ffff) 1;
            box-shadow: 0 0 60px rgba(255, 255, 0, 0.5),
                        0 0 100px rgba(255, 0, 150, 0.3);
        }

        @keyframes popupShow {
            0% {
                transform: scale(0) rotate(-20deg);
                opacity: 0;
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 32px;
            margin-bottom: 15px;
            color: #ffff00;
            text-shadow: 0 0 20px #ffff00;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
        }

        .modal-amount {
            font-size: 48px;
            color: #ffff00;
            font-weight: 900;
            margin: 25px 0;
            text-shadow: 0 0 30px #ffff00, 0 0 60px #ff00ff;
            font-family: 'Orbitron', sans-serif;
            animation: bounce 0.8s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .game-btn {
            padding: 18px;
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.2), rgba(0, 200, 255, 0.2));
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .game-btn:hover {
            transform: translateY(-5px);
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.4), rgba(0, 200, 255, 0.4));
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6),
                        0 0 15px rgba(255, 0, 150, 0.4);
            border-color: #ff00ff;
            color: #ffff00;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.3), rgba(0, 200, 255, 0.3));
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, rgba(255, 0, 150, 0.5), rgba(0, 200, 255, 0.5));
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .admin-search {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .player-result {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 150, 0.1));
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .player-result.active {
            display: block;
        }

        .result-item {
            margin-bottom: 12px;
            font-weight: 700;
            color: #00ffff;
        }

        .result-value {
            color: #ffff00;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #ffff00;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        h2 {
            color: #ffff00;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 15px #ffff00;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .reel {
                width: 55px;
                height: 85px;
                font-size: 32px;
            }

            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="stars-bg"></div>

    <div class="container">
        <div class="header">
            <h1>🎰 LuckySpin</h1>
            <div class="player-info">
                <div class="info-item">
                    <div class="info-label">Player ID</div>
                    <div class="info-value" id="playerId">--</div>
                </div>
                <div class="info-item">
                    <div class="info-label">💰 Balance</div>
                    <div class="info-value" id="coinBalance">0</div>
                </div>
            </div>
        </div>

        <div class="screen active" id="loginScreen">
            <h2 style="text-align: center;">Welcome to Premium Casino</h2>
            <div class="login-form">
                <div class="form-group">
                    <label>📱 Mobile Number</label>
                    <input type="tel" id="phoneInput" placeholder="10-digit mobile number" maxlength="10">
                </div>
                <div class="form-group">
                    <label>🔐 Password</label>
                    <input type="password" id="passwordInput" placeholder="Enter password">
                </div>
                <button class="btn btn-primary" onclick="login()">🎮 PLAY NOW</button>
                <button class="btn btn-secondary" onclick="loginAsAdmin()">👤 ADMIN</button>
            </div>
        </div>

        <div class="screen" id="mainMenuScreen">
            <button class="back-btn" onclick="logout()">← Logout</button>
            <h2 style="text-align: center;">MAIN MENU</h2>
            <div class="menu-grid">
                <button class="menu-btn" onclick="showGames()">🎮 GAMES</button>
                <button class="menu-btn" onclick="showRewards()">🎁 REWARDS</button>
                <button class="menu-btn" onclick="showReferral()">👥 REFER</button>
                <button class="menu-btn" onclick="showHistory()">📊 HISTORY</button>
                <button class="menu-btn" onclick="showProfile()">👤 PROFILE</button>
                <button class="menu-btn" onclick="showSupport()">📞 SUPPORT</button>
            </div>
        </div>

        <div class="screen" id="gamesScreen">
            <button class="back-btn" onclick="showMenu()">← Back</button>
            <h2>150 GAMES</h2>
            <div class="games-grid" id="gamesGrid"></div>
        </div>

        <div class="screen" id="gamePlayScreen">
            <button class="back-btn" onclick="showGames()">← Back</button>
            <div class="game-display">
                <div class="game-title" id="gameTitle">🎰 LUCKY SPIN</div>
                <div class="reels-wrapper">
                    <div class="reels-container">
                        <div class="reel" id="reel1">🚗</div>
                        <div class="reel" id="reel2">🐶</div>
                        <div class="reel" id="reel3">😼</div>
                        <div class="reel" id="reel4">🙈</div>
                        <div class="reel" id="reel5">🥳</div>
                    </div>
                </div>
            </div>

            <div class="bet-controls">
                <button class="bet-btn" onclick="decreaseBet()">−</button>
                <div class="bet-display">BET: <span id="betAmount">10</span></div>
                <button class="bet-btn" onclick="increaseBet()">+</button>
            </div>

            <button class="spin-btn" id="spinBtn" onclick="spin()">⚡ SPIN ⚡</button>

            <div class="win-display">
                <div class="win-label">🏆 THIS SPIN WIN</div>
                <div class="win-amount" id="winAmount">0 🪙</div>
            </div>
        </div>

        <div class="screen" id="profileScreen">
            <button class="back-btn" onclick="showMenu()">← Back</button>
            <h2>PLAYER PROFILE</h2>
            <div id="profileContent" style="margin-top: 30px;"></div>
        </div>

        <div class="screen" id="adminPanelScreen">
            <button class="back-btn" onclick="logout()">← Logout</button>
            <h2 style="color: #ff00ff;">ADMIN PANEL</h2>
            <div class="admin-search">
                <div class="form-group">
                    <label>🔍 Search Player</label>
                    <input type="text" id="adminSearchInput" placeholder="Player ID or Mobile">
                </div>
                <button class="btn btn-primary" onclick="searchPlayer()">SEARCH</button>
            </div>

            <div class="player-result" id="playerResult">
                <div class="result-item">📌 Player ID: <span class="result-value" id="resultPlayerId">--</span></div>
                <div class="result-item">📱 Mobile: <span class="result-value" id="resultMobile">--</span></div>
                <div class="result-item">💰 Balance: <span class="result-value" id="resultBalance">0</span> 🪙</div>

                <div class="form-group" style="margin-top: 15px;">
                    <label style="color: #00ffff;">Amount</label>
                    <input type="number" id="adminAmount" placeholder="Enter amount" min="1">
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="forceWin()" style="background: linear-gradient(135deg, #00ff00, #00aa00);">✅ FORCE WIN</button>
                    <button class="btn btn-primary" onclick="forceLoss()" style="background: linear-gradient(135deg, #ff0000, #aa0000);">❌ FORCE LOSS</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-content">
            <div class="modal-title">🎉 YOU WON! 🎉</div>
            <div class="modal-amount" id="modalWinAmount">0</div>
            <button class="modal-btn" onclick="closeModal()">CONTINUE</button>
        </div>
    </div>

    <div class="modal" id="megaWinModal">
        <div class="modal-content">
            <div class="modal-title">💥 MEGA WIN! 💥</div>
            <div class="modal-amount" id="megaWinAmount">0</div>
            <p style="color: #00ffff; margin: 20px 0; font-size: 18px;">CONGRATULATIONS!</p>
            <button class="modal-btn" onclick="closeMegaWin()">CLAIM PRIZE</button>
        </div>
    </div>

    <script>
        const gameSymbols = {
            1: ['🚗', '🐶', '😼', '🙈', '🥳', '💎', '⭐'],
            2: ['🎡', '🎢', '🎪', '🎭', '🎨', '🎯', '🎁'],
            3: ['💰', '🏆', '👑', '🌟', '✨', '🔱', '⚡'],
            4: ['🦁', '🐯', '🦒', '🐘', '🦓', '🌴', '🍃'],
            5: ['🐠', '🐟', '🐙', '🦑', '🌊', '⚓', '🏖️'],
        };

        const symbolPayouts = {
            '🚗': 100, '🐶': 80, '😼': 60, '🙈': 40, '🥳': 20,
            '🎡': 100, '🎢': 80, '🎪': 60, '🎭': 40, '🎨': 20,
            '💰': 100, '🏆': 80, '👑': 60, '🌟': 40, '✨': 20
        };

        let playerData = {
            id: '',
            phone: '',
            coins: 10000,
            totalWins: 0,
            gameHistory: []
        };

        let gameState = {
            currentGame: 1,
            currentBet: 10,
            isSpinning: false
        };

        function savePlayer() {
            localStorage.setItem('playerData', JSON.stringify(playerData));
        }

        function loadPlayer() {
            const saved = localStorage.getItem('playerData');
            if (saved) playerData = JSON.parse(saved);
        }

        function login() {
            const phone = document.getElementById('phoneInput').value;
            const password = document.getElementById('passwordInput').value;

            if (!phone || !password) {
                alert('❌ Enter phone and password');
                return;
            }

            if (phone.length !== 10 || isNaN(phone)) {
                alert('❌ Phone must be 10 digits');
                return;
            }

            playerData.id = 'PLY_' + phone;
            playerData.phone = phone;
            playerData.coins = 10000;
            savePlayer();

            showScreen('mainMenuScreen');
            updateHeader();
        }

        function loginAsAdmin() {
            const password = prompt('🔐 Admin Password:');
            if (password === 'admin123') {
                showScreen('adminPanelScreen');
            } else {
                alert('❌ Wrong password');
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showMenu() {
            loadPlayer();
            updateHeader();
            showScreen('mainMenuScreen');
        }

        function showGames() {
            showScreen('gamesScreen');
            generateGamesList();
        }

        function showProfile() {
            showScreen('profileScreen');
            document.getElementById('profileContent').innerHTML = `
                <div style="background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 150, 0.1)); padding: 20px; border-radius: 12px; border: 2px solid #00ffff;">
                    <p style="color: #00ffff; margin: 10px 0;"><strong>📌 Player ID:</strong> <span style="color: #ffff00;">${playerData.id}</span></p>
                    <p style="color: #00ffff; margin: 10px 0;"><strong>📱 Mobile:</strong> <span style="color: #ffff00;">${playerData.phone}</span></p>
                    <p style="color: #00ffff; margin: 10px 0;"><strong>💰 Balance:</strong> <span style="color: #ffff00; text-shadow: 0 0 10px #ffff00;">${playerData.coins} 🪙</span></p>
                    <p style="color: #00ffff; margin: 10px 0;"><strong>🏆 Total Wins:</strong> <span style="color: #ffff00;">${playerData.totalWins}</span></p>
                </div>
            `;
        }

        function showReferral() {
            alert('👥 REFERRAL CODE\n\n' + playerData.id + '\n\n✅ Share to earn 50 coins per friend!');
        }

        function showHistory() {
            let history = '📊 Recent Games:\n';
            playerData.gameHistory.slice(-5).forEach((game, i) => {
                history += `\n${i+1}. Game ${game.gameId} → Win: 🪙 ${game.win}`;
            });
            alert(history || 'No games played');
        }

        function showRewards() {
            alert('🎁 REWARDS\n\n💰 Daily Bonus: 100 🪙\n🎰 Weekly Jackpot Active!\n⭐ VIP Bonus: 500 🪙');
        }

        function showSupport() {
            alert('📞 SUPPORT\n\n📱 +91-9876543210\n📧 support@luckyspin.com\n⏰ Available 24/7');
        }

        function logout() {
            showScreen('loginScreen');
            document.getElementById('phoneInput').value = '';
            document.getElementById('passwordInput').value = '';
        }

        function generateGamesList() {
            const gamesGrid = document.getElementById('gamesGrid');
            gamesGrid.innerHTML = '';

            for (let i = 1; i <= 150; i++) {
                const symbols = gameSymbols[((i-1) % 5) + 1] || gameSymbols[1];
                const gameSymbol = symbols[0];
                const gameBtn = document.createElement('button');
                gameBtn.className = 'game-btn';
                gameBtn.innerHTML = `${gameSymbol}<br>GAME ${i}`;
                gameBtn.onclick = () => playGame(i);
                gamesGrid.appendChild(gameBtn);
            }
        }

        function playGame(gameId) {
            gameState.currentGame = gameId;
            document.getElementById('gameTitle').textContent = `🎰 GAME ${gameId}`;
            showScreen('gamePlayScreen');
        }

        function increaseBet() {
            if (gameState.currentBet < 100) {
                gameState.currentBet += 10;
                document.getElementById('betAmount').textContent = gameState.currentBet;
            }
        }

        function decreaseBet() {
            if (gameState.currentBet > 1) {
                gameState.currentBet -= 10;
                if (gameState.currentBet < 1) gameState.currentBet = 1;
                document.getElementById('betAmount').textContent = gameState.currentBet;
            }
        }

        function spin() {
            if (gameState.isSpinning) return;

            if (playerData.coins < gameState.currentBet) {
                alert('❌ Not enough coins!');
                return;
            }

            gameState.isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            playerData.coins -= gameState.currentBet;

            const symbols = gameSymbols[((gameState.currentGame - 1) % 5) + 1] || gameSymbols[1];
            const reels = ['reel1', 'reel2', 'reel3', 'reel4', 'reel5'];
            const selectedSymbols = [];

            reels.forEach((reelId, index) => {
                const reel = document.getElementById(reelId);
                reel.classList.add('spin');

                setTimeout(() => {
                    const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    selectedSymbols[index] = randomSymbol;
                    reel.textContent = randomSymbol;
                    reel.classList.remove('spin');
                    reel.classList.add('win');
                    
                    setTimeout(() => reel.classList.remove('win'), 500);
                }, 400 + index * 100);
            });

            setTimeout(() => {
                const winAmount = checkWins(selectedSymbols);
                playerData.coins += winAmount;

                if (winAmount > 0) {
                    document.getElementById('winAmount').textContent = winAmount + ' 🪙';
                    playWinAnimation(winAmount);

                    if (winAmount >= 1000) {
                        document.getElementById('megaWinAmount').textContent = winAmount + ' 🪙';
                        document.getElementById('megaWinModal').classList.add('active');
                    } else {
                        document.getElementById('modalWinAmount').textContent = winAmount + ' 🪙';
                        document.getElementById('winModal').classList.add('active');
                    }
                } else {
                    document.getElementById('winAmount').textContent = '0 🪙';
                }

                playerData.gameHistory.push({
                    gameId: gameState.currentGame,
                    bet: gameState.currentBet,
                    win: winAmount
                });

                playerData.totalWins += winAmount;
                savePlayer();
                updateHeader();

                gameState.isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            }, 800);
        }

        function checkWins(symbols) {
            let totalWin = 0;

            if (symbols[0] === symbols[1] && symbols[1] === symbols[2] && symbols[2] === symbols[3] && symbols[3] === symbols[4]) {
                totalWin += (symbolPayouts[symbols[0]] || 20) * gameState.currentBet * 5;
            } else if (symbols[0] === symbols[1] && symbols[1] === symbols[2] && symbols[2] === symbols[3]) {
                totalWin += 200 * gameState.currentBet;
            } else if (symbols[0] === symbols[1] && symbols[1] === symbols[2]) {
                totalWin += 50 * gameState.currentBet;
            } else if (symbols[0] === symbols[1]) {
                totalWin += 10 * gameState.currentBet;
            }

            return totalWin;
        }

        function playWinAnimation(amount) {
            if (navigator.vibrate) {
                if (amount >= 1000) {
                    navigator.vibrate([100, 50, 100, 50, 100, 50, 100]);
                } else if (amount >= 200) {
                    navigator.vibrate([50, 30, 50]);
                } else {
                    navigator.vibrate(30);
                }
            }
        }

        function closeModal() {
            document.getElementById('winModal').classList.remove('active');
        }

        function closeMegaWin() {
            document.getElementById('megaWinModal').classList.remove('active');
        }

        function searchPlayer() {
            const search = document.getElementById('adminSearchInput').value;
            if (!search) {
                alert('Enter player ID or mobile');
                return;
            }

            document.getElementById('resultPlayerId').textContent = search;
            document.getElementById('resultMobile').textContent = search.substring(0, 10);
            document.getElementById('resultBalance').textContent = Math.floor(Math.random() * 50000);
            document.getElementById('playerResult').classList.add('active');
        }

        function forceWin() {
            const amount = parseInt(document.getElementById('adminAmount').value);
            if (!amount || amount < 1) {
                alert('Enter valid amount');
                return;
            }

            const resultBalance = parseInt(document.getElementById('resultBalance').textContent);
            const newBalance = resultBalance + amount;
            document.getElementById('resultBalance').textContent = newBalance;
            alert(`✅ Force Win Applied!\n💰 Amount: ${amount}\n💳 New Balance: ${newBalance}`);
            document.getElementById('adminAmount').value = '';
        }

        function forceLoss() {
            const amount = parseInt(document.getElementById('adminAmount').value);
            if (!amount || amount < 1) {
                alert('Enter valid amount');
                return;
            }

            const resultBalance = parseInt(document.getElementById('resultBalance').textContent);
            const newBalance = Math.max(0, resultBalance - amount);
            document.getElementById('resultBalance').textContent = newBalance;
            alert(`✅ Force Loss Applied!\n💰 Amount: ${amount}\n💳 New Balance: ${newBalance}`);
            document.getElementById('adminAmount').value = '';
        }

        function updateHeader() {
            document.getElementById('playerId').textContent = playerData.id || '--';
            document.getElementById('coinBalance').textContent = playerData.coins + ' 🪙';
        }

        loadPlayer();
        updateHeader();
    </script>
</body>
</html>
